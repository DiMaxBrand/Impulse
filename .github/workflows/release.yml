name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true
      title:
        description: 'Release title (optional, default: "Impulse <version>"). For a stable release, use this for a short changelog headline.'
        required: false
        type: string
      description:
        description: 'Release description (optional, prepended above the auto-generated changelog)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      INPUT_VERSION_NAME: ${{ inputs.version_name }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_DESCRIPTION: ${{ inputs.description }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version name
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION="$INPUT_VERSION_NAME"
          else
            VERSION=$(grep 'val appVersion' build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | cut -d'+' -f1)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Official setup-java caching (keyed on build.gradle.kts/settings.gradle.kts/gradle
          # wrapper hashes, restored automatically) -- every release run was spinning up a fresh
          # VM and re-downloading every Gradle/Maven dependency from scratch, with no caching
          # anywhere in this workflow. A cache miss (dependency change) just falls back to a
          # normal download, so this has no downside, only a potential few-minutes-per-run win.
          cache: gradle

      - name: Prepare Gradle
        run: |
          if ! ./gradlew --version; then
            python3 .github/scripts/prepare_gradle.py
            ./gradlew --version
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Write signing.properties
        run: |
          cat > signing.properties <<EOF
          keystore=${{ github.workspace }}/keystore.jks
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          keystore.alias=${{ secrets.KEY_ALIAS }}
          EOF

      - name: Build signed release APK
        run: ./gradlew --init-script .github/scripts/ci-repositories.init.gradle assembleConversationsFreeRelease

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          TITLE="$INPUT_TITLE"
          if [ -z "$TITLE" ]; then
            TITLE="Impulse ${{ env.VERSION }}"
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES_FILE"
          if [ -n "$INPUT_DESCRIPTION" ]; then
            printf '%s\n' "$INPUT_DESCRIPTION" >> "$NOTES_FILE"
          fi

          APK_ASSETS=("build/outputs/apk/conversationsFree/release/Impulse_arm64.apk")

          gh release create "${{ env.VERSION }}" \
            $PRERELEASE_FLAG \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --generate-notes \
            "${APK_ASSETS[@]}"

      - name: Summarize step timings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            | python3 -c '
          import json, os, sys
          from datetime import datetime

          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          payload = json.load(sys.stdin)
          lines = ["## Release workflow step timings", "", "| Step | Duration |", "|---|---:|"]
          for job in payload.get("jobs", []):
              for step in job.get("steps", []):
                  start, end = step.get("started_at"), step.get("completed_at")
                  if not start or not end:
                      continue
                  seconds = max(0, int((parse(end) - parse(start)).total_seconds()))
                  name = step.get("name", "Unnamed step")
                  lines.append(f"| {name} | {seconds // 60}m {seconds % 60}s |")
          if len(lines) == 4:
              lines.append("| No completed step timings available | — |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          '
